name: Enclave verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: enclave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, contracts and provider adapters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - name: Offline Modal and demo preparation checks
        run: |
          npm run test:modal
          npx vitest run scripts/prepare-demo.test.ts
      - run: python -m pip install -r infra/near/requirements.txt
      - name: Offline NEAR verification checks
        run: npm run test:near
      - run: npm run contracts:compile
      - name: Unit and isolated database integration coverage
        run: npm run test:coverage
      - name: Install pinned Forge for contract coverage
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: npm run test:contracts -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            _backend/packages/core/coverage
            _backend/packages/agent-sdk/coverage
            _backend/apps/api/coverage
            _backend/apps/worker/coverage
            _backend/contracts/lcov.info

  frontend:
    name: Dashboard and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser flows with local API fixtures
        run: npm run test:e2e
      - name: Receipt verification against isolated contracts
        working-directory: .
        run: |
          npm --prefix _backend ci
          npm run test:receipt-chain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results
          path: |
            frontend/test-results
            frontend/playwright-report
