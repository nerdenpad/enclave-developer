name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enclave-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Redacted full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/security/run-security.py install-gitleaks
      - run: python scripts/security/run-security.py secrets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secret-scan-summary
          path: .local/security-results/secrets-summary.json
          retention-days: 14
          if-no-files-found: ignore

  static:
    name: Focused TypeScript and Python analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/security/requirements-linux.lock
      - run: python -m unittest discover -s scripts/security -p 'test_*.py'
      - name: Verify positive and negative rule fixtures
        run: python scripts/security/run-security.py semgrep-rules
      - run: python scripts/security/run-security.py semgrep
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: static-analysis-summary
          path: |
            .local/security-results/semgrep-summary.json
            .local/security-results/semgrep-rules-summary.json
          retention-days: 14
          if-no-files-found: ignore

  solidity:
    name: Solidity analysis and reviewed finding gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/security/requirements-linux.lock
      - run: python scripts/security/run-security.py install-solc
      - run: python scripts/security/run-security.py slither
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: solidity-analysis-summary
          path: .local/security-results/slither-summary.json
          retention-days: 14
          if-no-files-found: ignore
