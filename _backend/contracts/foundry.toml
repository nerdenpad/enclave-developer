[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 256 }

[rpc_endpoints]
local = "http://127.0.0.1:8545"

# Keep routine test/coverage runs bounded; the named campaign explores longer histories.
[profile.default.invariant]
runs = 32
depth = 64
fail_on_revert = true

[profile.stateful.invariant]
runs = 128
depth = 128
fail_on_revert = true
